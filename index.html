<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MGRT Media</title>
    <!--
      The live canvas is sized by --app-height (window.innerHeight, set by
      useViewportHeight once the experience mounts). The opening image on the
      startup cover has to occupy exactly that box or the crossfade into the
      live frame shows a scale jump, so the same value is set here, from the
      first line of the page, and kept current the same way the hook does it —
      on a change of width or orientation, never on a toolbar sliding away.
    -->
    <script>
      (function () {
        var root = document.documentElement
        var width = window.innerWidth
        var set = function () { root.style.setProperty('--app-height', window.innerHeight + 'px') }
        set()
        window.addEventListener('resize', function () { if (window.innerWidth !== width) { width = window.innerWidth; set() } })
        window.addEventListener('orientationchange', set)
      })()
    </script>
    <!--
      Cormorant — the one typographic addition from the 2026-09-05
      Musée-reference restraint pass (docs/creative-reference.md §4A):
      an elegant serif for the single discreet site mark
      (src/experience/ui/SiteMark.jsx), not a general UI typeface — every
      other label in this project stays on the existing system-ui sans.

      Loaded as a PRELOAD that promotes itself to a stylesheet on load, not as
      a plain stylesheet link. A stylesheet in the head blocks the module
      script below it, so this one file — a third-party request, ~930ms on a
      cold connection — held up the application bundle, and with it every
      request for the room's own models and textures. As a preload it is
      fetched at the same priority and applied the moment it arrives, but
      nothing waits for it.

      Nothing visible changes: the only Cormorant text in the experience (the
      wordmark and the section captions) is underneath the startup cover until
      the scene is revealed, which is far later than this file's arrival, and
      the URL keeps `display=swap` so a slow font shows Georgia rather than
      nothing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--
      The black the opening fades in from. Painted with the HTML itself, so the
      page is the void from its first frame; the scene renders underneath it
      and `src/experience/loading/startupCover.js` fades it away once the
      opening is ready, then removes it. It carries no branding and no
      progress: its only content is an error message, shown if the experience
      cannot start at all. Inline because the app's stylesheet arrives with the
      bundle, which is part of what is being waited for.
    -->
    <style>
      .startup-cover {
        --startup-warm: 255, 241, 220;
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 24px;
        background: #0d0d0d;
        /* A hair short of opaque, which no one can see against a black scene.
           A fully opaque, unchanging layer lets the browser skip drawing the
           canvas underneath it, and the canvas's first real presentation then
           lands on the first frame of the reveal as a ~100ms stall. */
        opacity: 0.999;
        transition: opacity 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .startup-cover--revealing {
        opacity: 0;
        pointer-events: none;
      }
      /* Exactly the canvas's box (.app-shell): same origin, same width, same
         --app-height. With the camera's vertical field of view fixed, a wide
         capture shown with object-fit: cover is the live frame, cropped. */
      .startup-cover__scene {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: var(--app-height, 100vh);
        opacity: 0;
        transition: opacity 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .startup-cover__scene img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
      }
      /* Faded in only once decoded, so black never jumps straight to a
         half-painted image. */
      .startup-cover--scene-ready .startup-cover__scene {
        opacity: 1;
      }
      .startup-cover__message {
        position: relative;
        margin: 0;
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.85);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
        color: rgba(var(--startup-warm), 0.6);
      }
      .startup-cover__retry {
        position: relative;
        margin: 0;
        text-shadow: 0 1px 14px rgba(0, 0, 0, 0.85);
        padding: 12px 4px;
        border: 0;
        border-bottom: 1px solid rgba(var(--startup-warm), 0.42);
        background: none;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(var(--startup-warm), 0.92);
        cursor: pointer;
      }
      .startup-cover__retry:focus-visible {
        outline: 1px solid rgba(var(--startup-warm), 0.6);
        outline-offset: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-cover,
        .startup-cover__scene {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-cover" class="startup-cover">
      <!--
        The opening frame of the live scene, captured from the build itself
        (scripts/capture-opening.mjs), so the room is on screen long before
        three.js is. The cover's own fade is then the handover: it crossfades
        this image into the canvas rendering the same frame underneath.
        Discoverable by the preload scanner from here, and only the matching
        <source> is fetched. Decorative — the live scene replaces it.
      -->
      <picture class="startup-cover__scene" aria-hidden="true">
        <source media="(max-aspect-ratio: 3/4)" srcset="/src/assets/startup/opening-portrait.webp" type="image/webp" />
        <source media="(min-aspect-ratio: 2/1)" srcset="/src/assets/startup/opening-ultrawide.webp" type="image/webp" />
        <img
          src="/src/assets/startup/opening-landscape.webp"
          alt=""
          fetchpriority="high"
          decoding="async"
          onload="this.decode().catch(function () {}).then(function () { var c = document.getElementById('startup-cover'); if (c) c.classList.add('startup-cover--scene-ready') })"
        />
      </picture>
      <p class="startup-cover__message" role="alert" hidden>The experience could not load</p>
      <button type="button" class="startup-cover__retry" hidden>Try again</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
